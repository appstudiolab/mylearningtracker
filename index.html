else if(a==='del'){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again to delete';return}var ent=b.dataset.ent;if(ent==='courses'&&D.sessions.some(function(s){return s.courseId===id})){toast('This course has study sessions. Delete or move them first.',true);return}D[ent]=D[ent].filter(function(x){return x.id!==id});closeM();save('Deleted.')}
else if(a==='copy'){var txt=JSON.stringify(D);var show=function(){$('#bmsg').innerHTML='<div class="fld"><label>Select all and copy:</label><textarea readonly>'+esc(txt)+'</textarea></div>'};try{navigator.clipboard.writeText(txt).then(function(){$('#bmsg').innerHTML='<div class="msg good">Backup copied. Paste it into a note or email it to yourself.</div>'}).catch(show)}catch(er){show()}}
else if(a==='restore'){openM('♻️ Restore from backup','<form class="form" data-f="restore">'+fld('Paste your backup text','<textarea name="t" style="min-height:150px"></textarea>')+'<div id="rmsg"></div><div class="mact"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Restore</button></div></form>')}
});
$('#mw').addEventListener('click',function(e){if(e.target===$('#mw'))closeM()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
document.addEventListener('input',function(e){var t=e.target;if(t.closest&&t.closest('[data-f="st"]')&&/^(date|start|end)$/.test(t.name))stHelper();if(t.dataset&&t.dataset.ch==='prog'){var pv=document.getElementById('pv_'+t.dataset.id);if(pv)pv.textContent=t.value+'%'}});
document.addEventListener('change',function(e){var t=e.target;
if(t.name==='status'&&t.closest('[data-f="st"]')){var f=t.form;$('#minbox').innerHTML=t.value==='done'?fld('Real minutes studied',inp('actualMinutes',Math.max(1,mins(f.elements.end.value)-mins(f.elements.start.value)),'number','min="1" max="1440"')):''}
var k=t.dataset&&t.dataset.ch;if(!k)return;var c=course(t.dataset.id);if(!c)return;
if(k==='prog'){c.progress=+t.value;save(c.progress>=100?'🏁 Course complete! '+(c.hasCert&&!c.certDone?'Tick the certificate when you get it.':''):'')}
else if(k==='cert'){c.certDone=t.checked;save(t.checked?'🏆 Certificate earned. Congratulations!':'')}
else if(k==='notes'){c.notes=t.value;save('Notes saved.')}});
document.addEventListener('submit',function(e){var f=e.target;if(!f.dataset||!f.dataset.f)return;e.preventDefault();var k=f.dataset.f,fd=new FormData(f),r={};fd.forEach(function(v,n){r[n]=v});
if(k==='st'){var box=$('#stmsg');if(!r.date||!r.start||!r.end||mins(r.end)<=mins(r.start)){box.innerHTML='<div class="msg bad">Please set a date and a valid start and end time.</div>';return}
var t={id:r.id,date:r.date,start:r.start,end:r.end},cl=clashOf(t);if(cl){box.innerHTML='<div class="msg bad">⚠ Clashes with '+esc(cl)+'. Pick another time.</div>';return}
if(r.id){var s=D.sessions.filter(function(q){return q.id===r.id})[0];s.courseId=r.courseId;s.date=r.date;s.start=r.start;s.end=r.end;s.note=r.note.trim();s.status=r.status;s.actualMinutes=r.status==='done'?String(+r.actualMinutes||dur(s)):'';closeM();save('Session updated.');return}
var n=+r.rep||1,added=0,skipped=0;for(var i=0;i<n;i++){var o={id:uid(),courseId:r.courseId,date:addDays(r.date,7*i),start:r.start,end:r.end,note:r.note.trim(),status:'planned',actualMinutes:''};if(i>0){var dc=defaultCourse(o.date);if(dc&&activeOn(o.date).length)o.courseId=activeOn(r.date).some(function(c){return c.id===r.courseId})?dc:r.courseId}if(i>0&&clashOf(o)){skipped++;continue}D.sessions.push(o);added++}
closeM();save(added>1?'📘 '+added+' sessions planned'+(skipped?' ('+skipped+' skipped because of clashes)':'')+'.':'📘 Session planned. You\'ve got this!');return}
if(k==='ev'){var m=$('#evmsg');if(!r.title.trim()){m.innerHTML='<div class="msg bad">Please add a title.</div>';return}if(!r.date||mins(r.end)<=mins(r.start)){m.innerHTML='<div class="msg bad">End time must be after start time.</div>';return}
r.days=fd.getAll('days').join(',');if(r.recurrence!=='once'&&(!r.until||r.until<r.date)){m.innerHTML='<div class="msg bad">“Repeat until” must be after the start date.</div>';return}if(r.recurrence==='custom'&&!r.days){m.innerHTML='<div class="msg bad">Pick at least one day.</div>';return}
var ev={id:r.id||uid(),kind:r.kind,title:r.title.trim(),date:r.date,start:r.start,end:r.end,recurrence:r.recurrence,until:r.recurrence==='once'?'':r.until,days:r.recurrence==='custom'?r.days:'',note:r.note.trim()};
var idx=-1;D.events.forEach(function(x,i){if(x.id===ev.id)idx=i});if(idx>=0)D.events[idx]=ev;else D.events.push(ev);
var hit=D.sessions.filter(function(s){return s.status!=='done'&&occ(ev,s.date)&&overlap(ev,s)}).length;closeM();save(hit?'⚠ Saved, but '+hit+' study session'+(hit>1?'s now clash':' now clashes')+' — shown in red.':'📌 Fixed schedule saved.');return}
if(k==='course'){var cm=$('#cmsg');if(!r.name.trim()||!r.start||!r.end||r.end<r.start){cm.innerHTML='<div class="msg bad">Please add a name and valid dates.</div>';return}if(r.link&&!/^https:\/\//i.test(r.link)){cm.innerHTML='<div class="msg bad">The link must start with https://</div>';return}
var c=course(r.id);var nc={name:r.name.trim(),provider:r.provider.trim(),emoji:r.emoji.trim()||'📘',focus:r.focus.trim(),start:r.start,end:r.end,hours:+r.hours||10,color:r.color,link:r.link.trim(),hasCert:!!r.hasCert};if(c){for(var p in nc)c[p]=nc[p]}else{nc.id=uid();nc.progress=0;nc.certDone=false;nc.notes='';D.courses.push(nc);D.courses.sort(function(a,b){return a.start<b.start?-1:1})}closeM();save('🎓 Course saved.');return}
if(k==='finish'){var mm=+r.m;if(!(mm>=1&&mm<=1440))return;var s2=D.sessions.filter(function(q){return q.id===r.id})[0];s2.status='done';s2.actualMinutes=String(mm);closeM();var ws=weekStats(monday(TODAY));save(ws.done>=ws.goal?'🎉 Weekly target reached! '+fH(ws.done)+' this week.':'✅ +'+fH(mm)+' logged. '+fH(Math.max(0,ws.goal-ws.done))+' to go this week.');return}
if(k==='settings'){var sm=$('#setmsg');if(+r.target<1||mins(r.prefEnd)<=mins(r.prefStart)||mins(r.dayEnd)<=mins(r.dayStart)||+r.slotMin<15){sm.innerHTML='<div class="msg bad">Please check the target and that each end time is after its start time.</div>';return}D.settings={target:+r.target,prefStart:r.prefStart,prefEnd:r.prefEnd,slotMin:+r.slotMin,dayStart:r.dayStart,dayEnd:r.dayEnd};closeM();save('⚙️ Settings saved.');return}
if(k==='connect'){var cm2=$('#cnmsg'),cfg={url:r.url.trim(),key:r.key.trim()};if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(cfg.url)){cm2.innerHTML='<div class="msg bad">Paste the Web App URL from Apps Script (it starts with https://script.google.com/…).</div>';return}cm2.innerHTML='<div class="msg info">⏳ Connecting…</div>';
api('get',null,cfg).then(function(j){CFG=cfg;try{localStorage.setItem(CFGKEY,JSON.stringify(cfg))}catch(e){}GAS=true;closeM();toast('🔗 Connected to Google Sheets!');mergeServer(j.state,true)}).catch(function(err){cm2.innerHTML='<div class="msg bad">Could not connect: '+esc(err&&err.message||err)+'. Check the URL, the key, and that access is set to “Anyone”.</div>'});return}
if(k==='restore'){try{var o2=JSON.parse(r.t);if(!o2.courses||!o2.sessions||!o2.events)throw 0;D=o2;closeM();save('♻️ Backup restored.')}catch(er){$('#rmsg').innerHTML='<div class="msg bad">That doesn\'t look like a valid backup.</div>'}}});
if(GAS){render();api('get').then(function(j){mergeServer(j.state,true)}).catch(function(err){sync='local';render();toast('Could not reach Google Sheets ('+(err&&err.message||err)+'). Showing data saved on this device.',true)})}
else render();
})();
</script></body></html>
